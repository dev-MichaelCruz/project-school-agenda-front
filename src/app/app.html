<div class="d-flex" [class.login-layout]="!auth.isLoggedIn()">

  @if(auth.isLoggedIn()) {

  <app-sidebar
    [menuOpen]="menuOpen()"
    (close)="closeMenu()" />

  }

  <div class="app-content container-fluid px-0 d-flex flex-column">

    <app-header
      [attr.showMenu]="auth.isLoggedIn()"
      (menuClick)="toggleMenu()" />

    <div class="main-content" [class.p-4]="auth.isLoggedIn()">
      <router-outlet />
    </div>

  </div>

</div>
