<a class="skip-link" href="#main-content" [attr.inert]="menuOpen() && mobile() ? '' : null" (click)="skipToContent($event)">Pular para o conteúdo principal</a>
<div class="d-flex" [class.login-layout]="!auth.isLoggedIn()">

  @if(auth.isLoggedIn()) {

  <app-sidebar
    [menuOpen]="menuOpen()"
    [modal]="menuOpen() && mobile()"
    (close)="closeMenu()" />

  }

  <div class="app-content container-fluid px-0 d-flex flex-column" [attr.inert]="menuOpen() && mobile() ? '' : null">

    <app-header
      [showMenu]="auth.isLoggedIn()"
      [menuOpen]="menuOpen()"
      (menuClick)="toggleMenu()" />

    <main id="main-content" tabindex="-1" class="main-content" [class.p-4]="auth.isLoggedIn()">
      <router-outlet />
    </main>

  </div>

</div>
