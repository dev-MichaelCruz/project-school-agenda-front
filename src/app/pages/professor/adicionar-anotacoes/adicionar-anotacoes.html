<div class="p-4">

  @if (etapa() === 'turma') {
    <app-selecionar-turma
      [turmas]="turmas"
      (selecionar)="selecionarTurma($event)"
    />
  }

  @if (etapa() === 'aluno') {
    <app-selecionar-aluno
      [alunos]="alunos()"
      [role]="role()"
      (selecionar)="selecionarAluno($event)"
      (voltar)="voltarTurma()"
    />
  }

  @if (etapa() === 'form') {
    <app-form-adicionar-anotacao
      [titulo]="
        role() === roleEnum.RESPONSIBLE
          ? 'Enviar anotação ao professor'
          : 'Adicionar anotação'
      "
      [mostrarPrivado]="role() === roleEnum.TEACHER"
      (voltar)="voltarAluno()"
      (salvar)="salvarAnotacao($event)"
    />
  }

</div>

<div
  class="modal fade"
  tabindex="-1"
  #modalRef
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Aviso</h5>
        <button
          type="button"
          class="btn-close"
          (click)="fecharModal()"
        ></button>
      </div>

      <div class="modal-body">
        <p>{{ modalMensagem() }}</p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="fecharModal()"
        >
          OK
        </button>
      </div>

    </div>
  </div>
</div>
