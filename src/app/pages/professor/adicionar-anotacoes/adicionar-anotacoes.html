<div class="page-content p-4">

  @if (etapa() === 'turma') {
    <app-selecionar-turma
      [turmas]="turmas()"
      (atualizar)="atualizarTurmas()"
      (selecionar)="selecionarTurma($event)"
    />
  }

  @if (etapa() === 'aluno') {
    <app-selecionar-aluno
      [alunos]="alunos()"
      [role]="role()"
      (atualizar)="atualizarAlunos()"
      (selecionar)="selecionarAluno($event)"
      (voltar)="voltarTurma()"
    />
  }

  @if (etapa() === 'form') {
    <app-form-adicionar-anotacao
      [titulo]="
        role() === roleEnum.RESPONSIBLE
          ? 'Enviar anotação ao professor'
          : 'Adicionar anotação'
      "
      [mostrarPrivado]="role() === roleEnum.TEACHER"
      (voltar)="voltarAluno()"
      (salvar)="salvarAnotacao($event)"
    />
  }

</div>

<div
  appAccessibleModal
  class="modal fade"
  tabindex="-1"
  aria-hidden="true"
  aria-labelledby="create-note-message-title"
  aria-describedby="create-note-message-description"
  #modalRef
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 id="create-note-message-title" class="modal-title fs-5">Aviso</h2>
        <button
          type="button"
          class="btn-close"
          aria-label="Fechar aviso"
          (click)="fecharModal()"
        ></button>
      </div>

      <div class="modal-body" id="create-note-message-description">
        <p>{{ modalMensagem() }}</p>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="fecharModal()"
        >
          OK
        </button>
      </div>

    </div>
  </div>
</div>
