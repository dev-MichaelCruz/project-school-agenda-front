<header class="page-header">
<h2>
  {{ titulo() }}
  <small class="text-muted">
    @if (role() === roleEnum.RESPONSIBLE) {
      / Selecione criança
    } @else {
      / Selecione aluno
    }
  </small>
</h2>

<app-list-toolbar label="Buscar aluno" [query]="busca()" (search)="busca.set($event)" (refresh)="atualizar.emit()" />
</header>

<div class="student-grid mt-4 d-flex gap-4 flex-wrap">
  @for (aluno of alunosFiltrados(); track aluno.id) {
    <button type="button" class="text-center container_aluno" (click)="selecionar.emit(aluno)">
      <span class="student-name">{{ aluno.nome }}</span>

      <div class="image-container-rounded">
        @if (aluno.sexo === 'M') {
          <img
            src="images/student-boy.png"
            width="60"
            alt=""
            class="boy-image"
          />
        } @else {
          <img
            src="images/student-girl.png"
            width="60"
            alt=""
          />
        }
      </div>
    </button>
  } @empty {
    <p class="text-muted" role="status">Nenhum aluno encontrado.</p>
  }
</div>

@if (role() === roleEnum.TEACHER) {
  <button type="button" class="btn btn-secondary mt-4" (click)="voltar.emit()">Voltar</button>
}
