<h2>
  Adicionar anotação /
  <small class="text-muted">
    @if (role() === roleEnum.RESPONSIBLE) {
      Selecione criança
    } @else {
      Selecione aluno
    }
  </small>
</h2>

<div class="mt-4 d-flex gap-4 flex-wrap">
  @for (aluno of alunos(); track aluno.id) {
    <div class="text-center" style="cursor: pointer" (click)="selecionar.emit(aluno)">
      <div>{{ aluno.nome }}</div>

      <div class="image-container-rounded">
        @if (aluno.sexo === 'M') {
          <img
            src="https://cdn-icons-png.flaticon.com/512/3884/3884864.png"
            width="60"
            [alt]="aluno.nome"
            class="boy-image"
          />
        } @else {
          <img
            src="https://cdn-icons-png.flaticon.com/512/4329/4329449.png"
            width="60"
            [alt]="aluno.nome"
          />
        }
      </div>
    </div>
  }
</div>

@if (role() === roleEnum.TEACHER) {
  <button type="button" class="btn btn-secondary mt-4" (click)="voltar.emit()">Voltar</button>
}
