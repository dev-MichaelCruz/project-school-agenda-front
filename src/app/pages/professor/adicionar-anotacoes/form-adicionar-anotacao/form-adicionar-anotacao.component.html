<header class="page-header">
  <h2 id="annotation-form-title">{{ titulo() }}</h2>
</header>

<form class="mt-4" [formGroup]="form" (ngSubmit)="enviar()" aria-labelledby="annotation-form-title">

  <input
    #fileInput
    type="file"
    aria-label="Selecionar imagem para a anotação"
    accept="image/*"
    hidden
    (change)="onFileSelected($event)" />

  <label class="visually-hidden" for="annotation-text">Texto da anotação</label>
  <textarea
    id="annotation-text"
    formControlName="texto"
    class="form-control"
    rows="5"
    placeholder="Digite sua anotação..."></textarea>

  @if (form.get('texto')?.invalid && form.get('texto')?.touched) {
  <div class="text-danger mt-1" id="annotation-text-error" aria-live="polite">
    O campo de mensagem é obrigatório.
  </div>
  }

  <div class="attachment-options d-flex justify-content-between mt-3">

    <div>

      <button
        type="button"
        class="btn btn-secondary"
        (click)="abrirSeletor(fileInput)">
        <i class="bi bi-card-image" aria-hidden="true"></i>
        <span class="d-none d-md-inline">Adicionar imagem</span>
        <span class="d-md-none">Anexar imagem</span>
      </button>

      @if (imagemSelecionada()) {
      <small class="attachment-name ms-2 text-muted" role="status" aria-live="polite">
        {{ nomeImagem() }}
      </small>
      }

    </div>

    @if (mostrarPrivado()) {

    <div class="form-check">

      <input
        id="privado"
        formControlName="privado"
        class="form-check-input rounded-input"
        type="checkbox" />

      <label for="privado" class="form-check-label">
        Não visível para os tutores
      </label>

    </div>

    }

  </div>

  <div class="form-actions d-flex gap-2 justify-content-end mt-3">

    <button
      type="button"
      class="btn btn-danger"
      (click)="voltar.emit()">
      Cancelar
    </button>

    <button
      type="submit"
      class="btn btn-success"
      >
      Salvar
    </button>

  </div>

</form>
