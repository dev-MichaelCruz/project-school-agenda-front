<header class="page-header">
<h2>
  Gerenciar anotações
  <small class="text-muted">
    / Selecione a sala
  </small>
</h2>

<app-list-toolbar label="Buscar turma" [query]="busca()" (search)="busca.set($event)" (refresh)="atualizar.emit()" />
</header>

<div class="class-grid mt-4 d-flex gap-2 flex-wrap">

  @for (turma of turmasFiltradas(); track turma.id) {

  <button
    type="button"
    class="btn btn-warning"
    (click)="selecionar.emit(turma)">
    {{ turma.nome }}
  </button>

  } @empty {
    <p class="text-muted" role="status">Nenhuma turma encontrada.</p>
  }

</div>
