<button
  type="button"
  class="anotacao-card"
  [attr.aria-label]="'Abrir anotação de ' + data() + (lida() ? ', lida' : ', não lida') + (role() === roleEnum.TEACHER && !visivelTutores() ? ', não visível para os tutores' : '')"
  [class.selecionada]="selecionada()"
  (click)="onClick()"
>

  <div class="data">
    {{ data() }}
  </div>

  <div class="rodape">

    @if (lida()) {
      <i class="bi bi-envelope-open icone-email-lido" aria-hidden="true"></i>
    } @else {
      <i class="bi bi-envelope icone-email-nao-lido" aria-hidden="true"></i>
    }

    @if (role() === roleEnum.TEACHER && !visivelTutores()) {
      <i class="bi bi-eye-slash icone-privado" aria-hidden="true"></i>
    }

  </div>

</button>
