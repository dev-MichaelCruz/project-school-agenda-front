<div class="anotacao-view">

  <header class="page-header">
  <h2>
    {{ titulo() }}
  </h2>
  </header>

  <div class="mt-2 text-muted small">

    <strong>Autor:</strong>

    {{ autor() }}

    @if (autorRole() === 'TEACHER') {
      <span class="badge bg-primary ms-2">
        Professor
      </span>
    }

    @if (autorRole() === 'RESPONSIBLE') {
      <span class="badge bg-warning text-dark ms-2">
        Responsável
      </span>
    }

  </div>

  <div class="data mt-3">
    {{ data() }}
  </div>

  @if (imagens().length) {

    <div class="mt-4 d-flex flex-wrap gap-3">

      @for (img of imagens(); track img) {

        <img
          [src]="img"
          class="img-anotacao rounded border"
          alt="Imagem da anotação"
        />

      }

    </div>

  }

  <div class="mensagem mt-4">
    {{ texto() }}
  </div>

  <div class="acoes">

    <button
      type="button"
      class="btn btn-secondary"
      (click)="cancelar.emit()">
      Voltar
    </button>

    @if (!lida() && mostrarBotaoLida()) {

      <button
        type="button"
        class="btn-lida"
        (click)="marcarComoLida.emit()">

        Marcar como lida

      </button>

    }

  </div>

</div>
