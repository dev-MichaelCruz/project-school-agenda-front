<div class="anotacao-view">

  <h2>
    {{ titulo() }}
  </h2>

  <div class="data mt-4">
    {{ data() }}
  </div>

  <div class="mensagem">
    {{ texto() }}
  </div>

  <div class="acoes">

    <button
      type="button"
      class="btn btn-secondary"
      (click)="cancelar.emit()">
      Voltar
    </button>

    @if (!lida() && mostrarBotaoLida()) {
    <button
      type="button"
      class="btn-lida"
      (click)="marcarComoLida.emit()">
      Marcar como lida
    </button>
    }

  </div>

</div>
