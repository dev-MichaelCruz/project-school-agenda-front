<div class="p-4">

  <h2 class="mb-4">Cadastrar família</h2>

  @if (toastVisivel) {
    <div class="alert alert-success">
      {{ toastMensagem }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="cadastrar()">

    <!-- RESPONSÁVEL -->
    <div class="row mb-3">

      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input
          type="text"
          class="form-control"
          formControlName="nome"
        />
      </div>

      <div class="col-md-6">
        <label class="form-label">Sobrenome</label>
        <input
          type="text"
          class="form-control"
          formControlName="sobrenome"
        />
      </div>

      <div class="col-md-8">
        <label class="form-label">E-mail</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label">
          Senha para acessar o sistema
        </label>
        <input
          type="password"
          class="form-control"
          formControlName="senha"
        />
      </div>

    </div>

    <div formArrayName="criancas">

      @for (crianca of criancas.controls; track $index) {

        <div
          class="row g-2 align-items-end mb-4"
          [formGroupName]="$index"
        >

          <div class="col-md-3">
            <label class="form-label">
              Nome da criança
            </label>

            <input
              type="text"
              class="form-control"
              formControlName="nome"
            />
          </div>

          <div class="col-md-2">
            <label class="form-label">Sexo</label>

            <select
              class="form-select"
              formControlName="sexo"
            >
              <option value="">Selecione</option>
              <option value="M">Masculino</option>
              <option value="F">Feminino</option>
            </select>
          </div>

          <div class="col-md-2">
            <label class="form-label">
              Data de nascimento
            </label>

            <input
              type="date"
              class="form-control"
              formControlName="nascimento"
            />
          </div>

          <div class="col-md-2">
            <label class="form-label">Turma</label>

            <input
              type="text"
              class="form-control"
              formControlName="turma"
            />
          </div>

          @if ($index > 0) {
            <div class="col-md-1">
              <button
                type="button"
                class="btn-remove-circle btn btn-rounded btn-danger"
                (click)="removerCrianca($index)"
              >
                <i class="bi bi-dash"></i>
              </button>
            </div>
          }

          @if ($index === criancas.length - 1) {
            <div class="col-md-1">
              <button
                type="button"
                class="btn-add-circle btn btn-rounded btn-secondary"
                (click)="adicionarCrianca()"
              >
                <i class="bi bi-plus"></i>
              </button>
            </div>
          }

        </div>

      }

    </div>

    <button
      type="submit"
      class="btn btn-primary btn-default-green mt-3 px-4 "
    >
      Cadastrar
    </button>

  </form>

</div>
