<div class="page-content management-page p-4">
  <header class="page-header">
    <h2>Deletar família</h2>
    <app-list-toolbar label="Buscar família" [query]="busca" (search)="busca = $event" (refresh)="carregarFamilias()" />
  </header>

  <!-- TOAST -->
  @if (toastVisivel) {
    <div class="alert alert-success">
      {{ toastMensagem }}
    </div>
  }

  @for (familia of familiasFiltradas; track familia.responsibleId) {
    <div class="item-row d-flex align-items-center justify-content-between mb-4">
      <span class="nome-familia">
        {{ familia.name }}
      </span>

      <button type="button" class="btn btn-delete btn-danger btn-rounded" [attr.aria-label]="'Excluir família ' + familia.name" (click)="abrirModal(familia)">
        <i class="bi bi-dash"></i>
      </button>
    </div>
  } @empty {
    <p class="text-muted" role="status">Nenhuma família encontrada.</p>
  }
</div>

<div class="modal fade" id="modalDeleteFamilia" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar exclusão</h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        Deseja deletar
        <strong>
          {{ familiaSelecionada?.name }} </strong
        >?
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

        <button type="button" class="btn btn-danger" (click)="confirmarDelete()">OK</button>
      </div>
    </div>
  </div>
</div>
