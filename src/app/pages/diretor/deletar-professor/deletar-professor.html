<div class="page-content management-page p-4">
  <header class="page-header">
    <h2>Deletar professor</h2>
    <app-list-toolbar label="Buscar professor" [query]="busca" (search)="busca = $event" (refresh)="carregarProfessores()" />
  </header>

  <!-- TOAST -->

  @if (toastVisivel) {
    <div class="alert alert-success">
      {{ toastMensagem }}
    </div>
  }

  @for (professor of professoresFiltrados; track professor.teacherId) {
    <div class="item-row d-flex align-items-center justify-content-between mb-4">
      <span class="nome-professor">
        {{ professor.name }}
      </span>

      <button type="button" class="btn btn-delete btn-danger btn-rounded" [attr.aria-label]="'Excluir professor ' + professor.name" (click)="abrirModal(professor)">
        <i class="bi bi-dash"></i>
      </button>
    </div>
  } @empty {
    <p class="text-muted" role="status">Nenhum professor encontrado.</p>
  }
</div>
<!-- MODAL -->

<div class="modal fade" id="modalDeleteProfessor" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar exclusão</h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Deseja deletar o professor

        <strong>
          {{ professorSelecionado?.name }} </strong
        >?
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

        <button type="button" class="btn btn-danger" (click)="confirmarDelete()">OK</button>
      </div>
    </div>
  </div>
</div>
