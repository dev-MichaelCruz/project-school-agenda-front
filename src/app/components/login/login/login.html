<section class="login-page" aria-labelledby="login-title">
  <div class="login-panel">
    <h2 id="login-title">Faça seu login</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" aria-labelledby="login-title">
      <div class="login-field">
        <label for="login-email">Email</label>
        <div
          class="login-input"
          [class.invalid]="form.controls.email.touched && form.controls.email.invalid"
        >
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            placeholder="Email"
            autocomplete="username"
            inputmode="email"
            autocapitalize="none"
            spellcheck="false"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
            [attr.aria-describedby]="
              form.controls.email.touched && form.controls.email.invalid ? 'login-email-error' : null
            "
          />
        </div>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="field-error" id="login-email-error">Informe um email válido.</p>
        }
      </div>

      <div class="login-field">
        <label for="login-password">Senha</label>
        <div
          class="login-input"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid"
        >
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="login-password"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Senha"
            autocomplete="current-password"
            [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
            [attr.aria-describedby]="
              form.controls.password.touched && form.controls.password.invalid
                ? 'login-password-error'
                : null
            "
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="passwordVisible()"
            aria-controls="login-password"
            (click)="passwordVisible.set(!passwordVisible())"
          >
            <i
              class="bi"
              [class.bi-eye]="!passwordVisible()"
              [class.bi-eye-slash]="passwordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="field-error" id="login-password-error">Informe sua senha.</p>
        }
      </div>

      <button class="login-submit" type="submit">Entrar</button>

      @if (error()) {
        <p class="login-error" role="alert">{{ error() }}</p>
      }
    </form>
  </div>
</section>
