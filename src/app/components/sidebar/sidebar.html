<div
  class="sidebar-overlay"
  [class.show]="menuOpen()"
  (click)="close.emit()"
></div>

<div
  class="sidebar-container"
  [class.mobile-dialog]="modal()"
  [attr.role]="modal() ? 'dialog' : null"
  [attr.aria-modal]="modal() ? 'true' : null"
  [attr.aria-labelledby]="modal() ? 'menu-title' : null"
>
<nav
  class="sidebar"
  id="main-menu"
  aria-label="Menu principal"
  [class.sidebar-open]="menuOpen()"
  (keydown)="onKeydown($event)"
>

  <div class="header-sidebar gap-2 px-2">
    <i class="bi bi-list fs-1 d-md-block d-none" aria-hidden="true"></i>
    <button type="button" id="close-menu-button" class="close-menu d-md-none" aria-label="Fechar menu" (click)="close.emit()">
      <i class="bi bi-x fs-1" aria-hidden="true"></i>
    </button>
    <p id="menu-title" class="sidebar-title m-0">Menu</p>
  </div>

  <ul class="nav flex-column mt-4">

    @for (item of menuItems(); track item.route) {
      <li class="nav-item">
        <a
          class="nav-link px-3 py-2"
          [routerLink]="item.route"
          routerLinkActive="active-link"
          ariaCurrentWhenActive="page"
          (click)="close.emit()"
        >
          {{ item.label }}
        </a>
      </li>
    }

  </ul>

</nav>
</div>
