<div
  class="sidebar-overlay"
  [class.show]="menuOpen()"
  (click)="close.emit()"
></div>

<nav
  class="sidebar"
  id="main-menu"
  aria-label="Menu principal"
  [class.sidebar-open]="menuOpen()"
  (keydown.escape)="close.emit()"
>

  <div class="header-sidebar gap-2 px-2">
    <i class="bi bi-list fs-1 d-md-block d-none"></i>
    <button type="button" class="close-menu d-md-none" aria-label="Fechar menu" (click)="close.emit()">
      <i class="bi bi-x fs-1" aria-hidden="true"></i>
    </button>
    <h3 class="m-0">Menu</h3>
  </div>

  <ul class="nav flex-column mt-4">

    @for (item of menuItems(); track item.route) {
      <li class="nav-item">
        <a
          class="nav-link px-3 py-2"
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="close.emit()"
        >
          {{ item.label }}
        </a>
      </li>
    }

  </ul>

</nav>
