<div
  class="sidebar-overlay"
  [class.show]="menuOpen()"
  (click)="close.emit()"
></div>

<nav
  class="sidebar"
  [class.sidebar-open]="menuOpen()"
>

  <div class="header-sidebar gap-2 px-2">
    <i class="bi bi-list fs-1 d-md-block d-none"></i>
    <i class="bi bi-x d-block fs-1 d-md-none"></i>
    <h3 class="m-0">Menu</h3>
  </div>

  <ul class="nav flex-column mt-4">

    @for (item of menuItems(); track item.route) {
      <li class="nav-item">
        <a
          class="nav-link px-3 py-2"
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="close.emit()"
        >
          {{ item.label }}
        </a>
      </li>
    }

  </ul>

</nav>
